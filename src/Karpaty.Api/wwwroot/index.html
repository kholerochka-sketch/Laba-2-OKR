<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карпати без натовпу</title>
    <link rel="stylesheet" href="style.css">
    <!-- Іконки FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>⛰️ Карпати без натовпу</h1>
            <p>Путівник маловідомими та спокійними місцями</p>
        </div>
    </header>

    <main class="container">
        <!-- Секція "Здоров'я API" (F0) -->
        <section class="section" id="health-section">
            <h2>Стан системи</h2>
            <div id="health-status" class="status-box">Завантаження...</div>
        </section>

        <!-- Секція Цікаві місця (F1 + F2) -->
        <section class="section" id="places-section">
            <h2>Цікаві місця</h2>

            <!-- Панель фільтрів (F2) -->
            <div class="filters-container">
                <button class="filter-btn active" data-category="">Усі місця</button>
                <button class="filter-btn" data-category="waterfall">Водоспади</button>
                <button class="filter-btn" data-category="viewpoint">Оглядові майданчики</button>
                <button class="filter-btn" data-category="meadow">Полонини</button>
            </div>

            <!-- Сітка карток місць -->
            <div id="places-list" class="cards-grid">
                <p class="placeholder">Дані завантажуються...</p>
            </div>
        </section>

        <!-- СЕКЦІЯ ПОРАД ДЛЯ ПОХОДУ (Фіча F3)  -->
        <section class="section" id="tips-section">
            <h2>Поради для походу</h2>
            <div id="tips-list" class="cards-grid">
                <p class="placeholder">Завантаження порад...</p>
            </div>
        </section>

        <!-- Модальне вікно деталей місця (F2) -->
        <div id="placeModal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <div id="modalDetails">
                    <!-- Контент підвантажується динамічно через JS -->
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Karpaty Guide — Командний проєкт</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
