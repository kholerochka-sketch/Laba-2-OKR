<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карпати без натовпу</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>⛰️ Карпати без натовпу</h1>
            <p>Путівник маловідомими та спокійними місцями</p>
        </div>
    </header>

    <main class="container">

        <!-- Стан API -->
        <section class="section" id="health-section">
            <h2>Стан системи</h2>
            <div id="health-status" class="status-box">
                Завантаження...
            </div>
        </section>

        <!-- Цікаві місця -->
        <section class="section" id="places-section">
            <h2>Цікаві місця</h2>

            <div class="filters-container">
                <button class="filter-btn active" data-category="">Усі місця</button>
                <button class="filter-btn" data-category="waterfall">Водоспади</button>
                <button class="filter-btn" data-category="viewpoint">Оглядові майданчики</button>
                <button class="filter-btn" data-category="meadow">Полонини</button>
            </div>

            <div id="places-list" class="cards-grid">
                <p class="placeholder">Дані завантажуються...</p>
            </div>
        </section>

        <!-- Поради для походу -->
        <section class="section" id="tips-section">
            <h2>Поради для походу</h2>

            <div id="tips-list" class="cards-grid">
                <p class="placeholder">Завантаження порад...</p>
            </div>
        </section>

        <!-- Загальні відгуки -->
        <section class="section" id="reviews-section">
            <h2>Відгуки мандрівників</h2>

            <div id="reviews-container" class="cards-grid">
                <p class="placeholder">Завантаження відгуків...</p>
            </div>
        </section>

    </main>

    <!-- Модальне вікно місця -->
    <div id="place-modal" class="modal">
        <div class="modal-content">

            <button type="button" class="close-modal" id="close-modal">
                &times;
            </button>

            <div id="modalDetails">
                <!-- Деталі місця завантажуються через JavaScript -->
            </div>

            <!-- Форма відгуку -->
            <section class="review-form-section">
                <h3>Залишити відгук</h3>

                <form id="review-form">

                    <div class="form-group">
                        <label for="reviewer-name">Ваше ім'я</label>
                        <input
                            type="text"
                            id="reviewer-name"
                            name="name"
                            required
                            maxlength="100"
                            placeholder="Введіть ваше ім'я">
                    </div>

                    <div class="form-group">
                        <label for="reviewer-email">Електронна пошта</label>
                        <input
                            type="email"
                            id="reviewer-email"
                            name="email"
                            required
                            placeholder="example@gmail.com">
                    </div>

                    <div class="form-group">
                        <label for="review-rating">Оцінка</label>
                        <select id="review-rating" name="rating" required>
                            <option value="5">5 — Відмінно</option>
                            <option value="4">4 — Добре</option>
                            <option value="3">3 — Нормально</option>
                            <option value="2">2 — Погано</option>
                            <option value="1">1 — Дуже погано</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="review-text">Ваш відгук</label>
                        <textarea
                            id="review-text"
                            name="message"
                            required
                            maxlength="2000"
                            placeholder="Поділіться своїми враженнями..."></textarea>
                    </div>

                    <button type="submit" class="submit-btn">
                        Надіслати відгук
                    </button>

                </form>
            </section>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
