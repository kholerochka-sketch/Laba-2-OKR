<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карпати без натовпу</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>⛰️ Карпати без натовпу</h1>
            <p>Путівник маловідомими та спокійними місцями</p>
        </div>
    </header>

    <main class="container">
        <!-- Секція "Здоров'я API" (для перевірки F0) -->
        <section class="section" id="health-section">
            <h2>Стан системи</h2>
            <div id="health-status" class="status-box">Завантаження...</div>
        </section>

        <!-- Каркаси майбутніх секцій F1–F4 -->
        <section class="section" id="places-section">
            <h2>Цікаві місця</h2>
            <div id="places-list" class="cards-grid">
                <p class="placeholder">Дані завантажуються...</p>
            </div>
        </section>

        <section class="section" id="tips-section">
            <h2>Поради для походу</h2>
            <div id="tips-list" class="cards-grid">
                <p class="placeholder">Дані завантажуються...</p>
            </div>
        </section>

        <section class="section" id="feedback-section">
            <h2>Залишити відгук</h2>
            <div class="placeholder">Форма буде додана у F4</div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Karpaty Guide — Командний проєкт</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
